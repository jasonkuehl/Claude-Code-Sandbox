name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action asks GitHub's API what kind of account owns the repo and
      # demands a license when that fails, so run the gitleaks binary directly
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${file}$" | sha256sum -c -
          tar -xzf "$file" gitleaks && install -m 755 gitleaks /usr/local/bin/gitleaks && rm -f gitleaks "$file"

      - name: Gitleaks scan
        run: gitleaks git --redact --verbose --exit-code 1 .

  lint:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning

  validate:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          # Use a dummy password so compose config doesn't complain about missing .env
          SSH_PASSWORD=ci-validate docker compose config --quiet

  image-scan:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scanning
        run: docker build -f Dockerfile.ssh -t scan-target .
      # aquasecurity/trivy-action fetches its installer from GitHub with the job token,
      # which is a Gitea token here, so install the release binary directly
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.76.1
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/trivy_${TRIVY_VERSION}_checksums.txt" | grep " ${file}$" | sha256sum -c -
          tar -xzf "$file" trivy && install -m 755 trivy /usr/local/bin/trivy && rm -f trivy "$file"
          trivy --version

      - name: Trivy vulnerability scan
        run: trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 scan-target
